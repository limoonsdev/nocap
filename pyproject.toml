[project]
name = "nocaptcha"
version = "0.1.0"
description = "NoCaptcha — Solveur local, rapide et open-source : reCAPTCHA v2/v3, hCaptcha, Turnstile, FunCaptcha, GeeTest, OCR, image & audio. 100% local, API localhost + beau CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NoCaptcha Contributors" }]
keywords = ["captcha", "recaptcha", "hcaptcha", "ocr", "onnx", "playwright", "selenium", "fastapi", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer[all]>=0.12",
  "rich>=13.7",
  "pillow>=10.2",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
  "onnxruntime>=1.17",
  "ddddocr>=1.5",
]

[project.optional-dependencies]
ai-light = [
  "onnxruntime>=1.17",
  "rapidocr-onnxruntime>=1.3",
]
ai-full = [
  "ultralytics>=8.2",
  "torch>=2.2",
  "transformers>=4.38",
  "easyocr>=1.7",
]
gpu = [
  "torch>=2.2",  # cu124 par defaut ; pour CUDA 11/12 voir pytorch.org
  "onnxruntime-gpu>=1.17; sys_platform != 'darwin'",
  "onnx>=1.15",
]
browser = [
  "selenium>=4.19",
  "webdriver-manager>=4.0",
  "playwright>=1.43",
]
audio = [
  "SpeechRecognition>=3.10",
  "pydub>=0.25",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.9",
]
all = [
  "nocaptcha[ai-light,browser,audio]",
]

[project.scripts]
nocaptcha = "nocaptcha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocaptcha"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
